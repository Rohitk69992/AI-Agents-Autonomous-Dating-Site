services:
  - type: web
    name: auramatch-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: auramatch-postgres
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: BACKEND_CORS_ORIGINS
        value: '["https://auramatch.vercel.app","http://localhost:3000"]'

databases:
  - name: auramatch-postgres
    databaseName: auramatch
    user: auramatch
    plan: starter
